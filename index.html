<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>換金計算ツール</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>換金計算ツール</h1>

  <!-- 店舗選択 -->
  <section class="store">
    <label for="storeSelect" class="field-label">店舗</label>
    <select id="storeSelect"></select>
    <div class="store-actions">
      <button type="button" id="addBtn" class="btn">＋ マイホ追加</button>
      <button type="button" id="editBtn" class="btn btn-ghost">編集</button>
      <button type="button" id="delBtn" class="btn btn-danger">削除</button>
    </div>
  </section>

  <!-- 台の種類 -->
  <section>
    <p class="field-label">台の種類</p>
    <div id="typeTabs" class="tabs" role="tablist"></div>
    <p class="info" id="info"></p>
  </section>

  <!-- 入力と結果 -->
  <section>
    <label for="medals" class="field-label" id="medalsLabel">今の持ちメダル枚数</label>
    <input id="medals" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：530">

    <div class="result">
      <div class="box">
        <span>持ち帰れる金額</span>
        <strong id="yen">0円</strong>
      </div>
      <div class="box">
        <span>余り</span>
        <strong id="rest">0枚</strong>
      </div>
    </div>
    <p class="note" id="note"></p>
    <p class="note next" id="next"></p>
  </section>
</main>

<!-- マイホ追加・編集フォーム -->
<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">マイホ追加</h2>

    <label for="fName" class="field-label">店舗名</label>
    <input id="fName" type="text" maxlength="30" autocomplete="off" placeholder="例：〇〇駅前店">

    <p class="field-label">設置している台</p>
    <div id="fTypes"></div>

    <p class="form-hint">交換率は「100円あたり何枚（何玉）か」を入力します。景品は500円単位で計算します。</p>
    <p class="err" id="fErr"></p>

    <div class="sheet-actions">
      <button type="button" id="cancelBtn" class="btn btn-ghost">キャンセル</button>
      <button type="button" id="saveBtn" class="btn">保存</button>
    </div>
  </div>
</div>

<footer>
  made by hiro/ヒロ ／ <a href="https://github.com/h1ro223" target="_blank" rel="noopener">GitHub</a>
</footer>
<script src="./script.js"></script>
</body>
</html>
